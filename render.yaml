# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render "New +" -> "Blueprint",
# point it at the repo. Render reads this file and creates all 3 resources
# below in one go. After the first deploy, update the two placeholder URLs
# marked below to match the actual *.onrender.com hostnames Render assigns
# (or your custom domains) and redeploy.
#
# NOTE ON UPLOADED IMAGES: this Blueprint runs the backend on the free
# plan, which does not support persistent disks at all (Render rejects the
# whole Blueprint if a free-tier service declares one). So `uploads/` is
# ephemeral here — inspection records and OCR results in Postgres survive
# restarts fine, but the "Evidence" photo behind them won't load after a
# redeploy. Fine for a demo; see the comment next to `packsure-backend`
# below for how to add real persistence back once you need it.

databases:
  - name: packsure-db
    plan: free
    databaseName: packsure
    user: packsure

services:
  - type: web
    name: packsure-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: packsure-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /data/uploads
      # Update this after the frontend's real URL is known (see note above).
      # Must be a JSON array — pydantic-settings parses CORS_ORIGINS as a list.
      - key: CORS_ORIGINS
        value: '["https://packsure-frontend.onrender.com"]'
    # NOTE: no `disk:` here — Render rejects the Blueprint outright if a
    # free-tier service declares one (persistent disks require a paid
    # instance type). That means uploads/ is ephemeral for now: fine for a
    # demo/first deploy. Once you're ready to keep uploaded photos across
    # restarts, either (a) change `plan: free` above to `plan: starter` and
    # add back:
    #     disk:
    #       name: packsure-uploads
    #       mountPath: /data/uploads
    #       sizeGB: 1
    # or (b) swap app/services/storage.py for S3/R2 instead (works on the
    # free plan too, and only that one file needs to change).

  - type: web
    name: packsure-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Update this after the backend's real URL is known (see note above).
      - key: VITE_API_URL
        value: https://packsure-backend.onrender.com/api
    routes:
      # SPA fallback — without this, refreshing on e.g. /app/repository 404s.
      - type: rewrite
        source: /*
        destination: /index.html
