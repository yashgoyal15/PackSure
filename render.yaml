# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Backend + Postgres only — the frontend now deploys separately on Vercel
# (see frontend/vercel.json), so it's no longer part of this Blueprint.
#
# Deploy: push this repo to GitHub, then in Render "New +" -> "Blueprint",
# point it at the repo. After the first deploy, note the backend's real
# *.onrender.com URL and:
#   1. Set it as VITE_API_URL (+ "/api") in the Vercel project's env vars.
#   2. Come back here and update CORS_ORIGINS below to the Vercel URL.
#
# NOTE ON UPLOADED IMAGES: this runs the backend on the free plan, which
# does not support persistent disks at all (Render rejects the whole
# Blueprint if a free-tier service declares one). So `uploads/` is
# ephemeral — inspection records and OCR results in Postgres survive
# restarts fine, but the "Evidence" photo behind them won't load after a
# redeploy. Fine for a demo; see the comment below for adding it back.

databases:
  - name: packsure-db
    plan: free
    databaseName: packsure
    user: packsure

services:
  - type: web
    name: packsure-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: packsure-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /data/uploads
      # Update to your real Vercel URL once it exists, e.g.
      # '["https://packsure.vercel.app"]'. Must be a JSON array —
      # pydantic-settings parses CORS_ORIGINS as a list. If you keep
      # Vercel's preview-deployment URLs too, list them all here.
      - key: CORS_ORIGINS
        value: '["https://packsure.vercel.app"]'
    # NOTE: no `disk:` here — Render rejects the Blueprint outright if a
    # free-tier service declares one (persistent disks require a paid
    # instance type). Once you're ready to keep uploaded photos across
    # restarts, either (a) change `plan: free` above to `plan: starter` and
    # add back:
    #     disk:
    #       name: packsure-uploads
    #       mountPath: /data/uploads
    #       sizeGB: 1
    # or (b) swap app/services/storage.py for S3/R2 instead (works on the
    # free plan too, and only that one file needs to change).
